# The apps whose settings `make mackup-backup` copies to Dropbox, and
# `make mackup-restore` copies back. Add or remove a line to change the list.
#
# scripts/mackup.sh writes ~/.mackup.cfg from this file, with a [storage]
# section on top: engine = dropbox, directory = MACKUP_DIR from
# custom/dotfiles.env (the install wizard asks for it).
#
# Names are Mackup definitions (`mackup list`), or ours in
# config/mackup/applications/, which win over Mackup's when the name is the same.

[applications_to_sync]
# Terminal and shell
ghostty
terminal
oh-my-zsh-custom

# Editors and dev tools
zed
xcode
dash

# AI agents and dictation
claude-code
opencode
superwhisper

# Git, containers and cloud
github-cli
lazygit
colima
docker
lazydocker
k9s
gcloud
azure

# Productivity and menu bar
alfred
hazel
cardinal
mole
amphetamine
dato
ferdium

# Files and media
cyberduck
betterzip
calibre
syntax-highlight

# macOS
macos-shortcuts
